[build]
  command = "npm run build"
  publish = "dist"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[redirects]]
  from = "/contacts.html"
  to = "/portfolio.html"
  status = 301

[[redirects]]
  from = "/politika-konfidencialnosti.html"
  to = "/privacy.html"
  status = 301

[[redirects]]
  from = "/privacy-policy.html"
  to = "/privacy.html"
  status = 301
